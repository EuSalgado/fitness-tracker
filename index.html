<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101318">
  <meta name="description" content="Registro personal de entrenamiento de fuerza, running y progreso físico.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Fit Tracker">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="assets/icon-180.png">
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
  <title>Fitness Tracker</title>
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <a class="brand" href="#" data-route="inicio" aria-label="Fitness Tracker, inicio">
        <span class="brand-mark">F</span>
        <span><strong>FITNESS</strong><small>TRACKER</small></span>
      </a>
      <div class="topbar-right"><span id="local-status" class="local-status">Guardado local</span></div>
    </header>
    <main id="app" class="main-content" aria-live="polite"><div class="loading-state">Cargando Fitness Tracker…</div></main>
    <nav class="bottom-nav" aria-label="Navegación principal">
      <button class="nav-item active" data-route="inicio"><span>⌂</span><small>Inicio</small></button>
      <button class="nav-item" data-route="entrenar"><span>＋</span><small>Entrenar</small></button>
      <button class="nav-item" data-route="rutina"><span>▤</span><small>Rutina</small></button>
      <button class="nav-item" data-route="historial"><span>◷</span><small>Historial</small></button>
      <button class="nav-item" data-route="progreso"><span>↗</span><small>Progreso</small></button>
    </nav>
  </div>
  <div id="toast-region" class="toast-region" aria-live="assertive"></div>
  <div id="modal-root"></div>
  <script src="app.js"></script>
</body>
</html>
